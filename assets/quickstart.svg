<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="408" viewBox="0 0 1440 408" role="img" aria-label="Autody 快速上手">
<title>Autody 快速上手</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M0 0L10 5L0 10z" fill="#749080"/>
</marker>
</defs>
<rect width="1440" height="408" fill="#f4f2e9"/>
<g font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
<text x="54" y="65" font-size="38" fill="#203d35" font-weight="700">从一句话开始</text>
<text x="54" y="105" font-size="23" fill="#607466" font-weight="400">安装一次，后续把主题交给 Autody。</text>
<rect x="54" y="149" width="430" height="222" rx="18" fill="#fff"/>
<rect x="78" y="174" width="46" height="44" rx="12" fill="#d9e7bf"/>
<text x="92" y="205" font-size="26" fill="#203d35" font-weight="700">1</text>
<text x="142" y="206" font-size="27" fill="#203d35" font-weight="600">安装全部 Skills</text>
<text x="79" y="266" font-size="21" fill="#203d35" font-weight="400">node bin/autody.js install</text>
<text x="79" y="322" font-size="20" fill="#6c7d70" font-weight="400">10 个 Skills 一次安装</text>
<rect x="505" y="149" width="430" height="222" rx="18" fill="#fff"/>
<rect x="529" y="174" width="46" height="44" rx="12" fill="#d9e7bf"/>
<text x="543" y="205" font-size="26" fill="#203d35" font-weight="700">2</text>
<text x="593" y="206" font-size="27" fill="#203d35" font-weight="600">给一个 topic</text>
<text x="530" y="266" font-size="24" fill="#203d35" font-weight="400">$autody 调研「你的主题」</text>
<text x="530" y="322" font-size="20" fill="#6c7d70" font-weight="400">Agent 自动执行双平台流程</text>
<rect x="956" y="149" width="430" height="222" rx="18" fill="#fff"/>
<rect x="980" y="174" width="46" height="44" rx="12" fill="#d9e7bf"/>
<text x="994" y="205" font-size="26" fill="#203d35" font-weight="700">3</text>
<text x="1044" y="206" font-size="27" fill="#203d35" font-weight="600">收到研究成果</text>
<text x="981" y="266" font-size="24" fill="#203d35" font-weight="400">报告 + 选题 + 来源</text>
<text x="981" y="322" font-size="20" fill="#6c7d70" font-weight="400">遇到中断，继续同一份任务</text>
